<section><h2>このサイトでできること</h2><p>ポーカーなどで使うコインを、みんなのスマホで管理します。実物のコインを持ち運ぶ必要はありません。全員の残高・ポット・借金が、同じ画面でリアルタイムに共有されます。</p><ul><li>最大8人まで。全員が同じコインでスタート(初期値は10,000。代表者が、ゲーム開始前に「初期コイン」ボタンで変更できます)</li><li>ログイン不要。同じ端末で開き直すと、自動でルームに戻ります</li></ul></section>
<section><h2>まず3ステップ</h2><ol class=st3><li><b>名前を入れて、ルームを作る</b><br>友だちは、4桁のルームコードか、共有URLで入ります</li><li><b>みんなが揃ったら「ゲーム開始」</b><br>全員が同じ枚数のコインでスタートします</li><li><b>「賭けを始める」→ ベット → 結果入力</b><br>これを何回でも繰り返し、終わったら「最終精算」で順位が出ます</li></ol></section>
<section><h2>全体の流れ</h2><ul><li>① ホームで名前を入れて「決定」</li><li>② 「ルームを作る」か、コードで「ルームに参加」</li><li>③ 全員が揃ったら、代表者が「ゲーム開始」</li><li>④ 準備 → 賭け → 結果 を、何度でも繰り返す</li><li>⑤ 代表者が最終精算 → 借金を引いた順位を発表</li></ul><p>ルームへの招待は、☰メニューの「ルームを共有」でURLを送るだけです。開始後の途中参加もできます。</p></section>
<section><h2>3つのフェーズ</h2><ul><li><b>準備</b>: 送金・貸し借り・銀行借入・親の交代など、コインのやり取りをする時間。ここでしかできません</li><li><b>賭け</b>: 全員がベットする時間。最低100コインから、金額は自由。残高が足りない人は、準備のうちに借りておきます</li><li><b>結果</b>: ポットの配分や、当たり外れを入力して、コインを動かす時間。終わると準備に戻ります</li></ul><p>賭けの途中は送金や借入ができないので、残高が食い違いません。</p></section>
<section><h2>賭け方は2種類あります</h2><p>「賭けを始める」を押すと、どちらかを選びます。</p><div class=cmp><div><b>👥 みんなで勝負</b>プレイヤー同士で勝ち負けを決める。全員のベットが「ポット」に集まり、勝った人が受け取ります。<div class=ex>例: ポーカー、大富豪、ババ抜き、じゃんけん大会</div></div><div><b>🎩 親と勝負</b>1人の「親(胴元)」と、ほかの全員が勝負する。当たれば「ベット × 倍率」を親からもらい、ハズレは親のものになります。<div class=ex>例: ルーレット、サイコロの目当て、ブラックジャック</div></div></div></section>
<section><h2>どっちを選ぶ?(迷ったとき)</h2><div class=rec><b>Q. 勝ち負けは、参加者どうしで決まる?</b><br>→ はい: <b>みんなで勝負</b></div><div class=rec><b>Q. 親役が1人いて、ほかの人が「当たり・ハズレ」で勝負する?</b><br>→ はい: <b>親と勝負</b>(先に誰かが親になる必要があります)</div><div class=rec><b>Q. それでも迷う</b><br>→ <b>みんなで勝負</b>を選べば大丈夫です。結果入力で、人ごとに自由な金額を配れるので、ほとんどのゲームに使えます。</div></section>
<section><h2>みんなで勝負: 結果の入れかた</h2><p>賭けを締め切ると、ポットの合計が出ます。1人ずつ、もらう金額を入れます。</p><ul><li><b>金額の欄</b>: その人がもらう額を、自由に入力します(1位に多め、2位に少なめ、など)</li><li><b>総取り</b>: 押した人に、ポットを全部渡します</li><li><b>残り→</b>: まだ配っていない分を、その人に全部渡します</li><li><b>全員にベットを返す</b>: 引き分けのとき。みんなに、賭けた額がそのまま戻ります</li><li><b>均等に分ける</b>: ベットした人で、山分けします</li></ul><p>画面の上に「ぴったり! 確定できます」と出たら、「配分を確定」を押せます。</p><div class=ex>例: 4人が1,000ずつ賭けて、ポットが4,000。1位に2,500、2位に1,500を配るなら、1位の欄に2500、2位の欄に1500と入れます(合計4,000)。</div></section>
<section><h2>親と勝負: 親のしくみ</h2><p>親は同時に1人だけ。準備フェーズに「コイン → 親になる」で、ハウスポット(親の持ち金)にコインを入れて始めます。</p><ul><li>ハズレのベットは、ハウスポットに入ります</li><li>当たりの人には「ベット × 倍率」が、ハウスポットから払われます(2倍なら、賭けた額の2倍)</li><li>引き分けは、ベットがそのまま返ります</li><li>ハウスポットが足りないときは、払える分までです</li><li>親は、自分の賭けには参加できません</li><li>「親を降りる」と、ハウスポットの残りが全額、その人に戻ります。親の交代はこの方法で行います</li></ul><p>結果の入力は、親か代表者が行います。1人ずつ「ハズレ・当たり(倍率)・引分」を選びます。</p><div class=ex>例: 親がハウスに10,000を入れ、Aさんが1,000賭けて「2倍」に当たると、Aさんに2,000が戻ります(結果として+1,000)。ハズレなら、1,000は親のものになります。</div></section>
<section><h2>貸し借りと銀行</h2><ul><li><b>送金・貸す・借りる・返す</b>は、申請を出して、相手が承認すると成立します。間違いを防ぐためです。申請は、届くと画面に知らせが出ます。タップすると、ログの「未」から承認できます</li><li><b>銀行</b>は、初期コインと同じ額(初期値は10,000)ずつ、いつでも借りられます。上限も利息もありません。ただし、最終精算でその分が引かれます</li><li>プレイヤー同士の借金は、最終精算で、貸した人に加算、借りた人から減算されます</li></ul></section>
<section><h2>代表者の役目</h2><p>ルームを作った人が代表者です。ゲーム開始、賭けの開始と締め切り、ポットの配分、最終精算を担当します。「全員に同じ額を賭けさせる」も使えるので、みんながスマホを触らなくても進められます。代表者は、☰メニューの「代表者を移す」で、ほかの人に交代できます。</p></section>
<section><h2>画面の見方</h2><ul><li><b>上のバー</b>: 色と「準備 → 賭け → 結果」の印で、いまの場面が分かります。右上の☰がメニューです</li><li><b>あなたのコイン</b>: 自分の残高です。増えると緑、減ると赤に光り、コインが動いて増減を伝えます</li><li><b>メッセージ</b>: 今なにをする場面か、誰を待っているかを表示します</li><li><b>参加者の一覧</b>: 残高やベットの状況が見えます。名前をタップすると、その人への送る・貸す・借りるがすぐ開きます(準備フェーズ)</li><li><b>金色の大きいボタン</b>: 今の場面で次にやること。下の小さな文字が、押すと何が起こるかの説明です。押せないときは点線の枠になり、待っている理由が出ます</li><li><b>「コイン」ボタン</b>: 送る・貸す・借りる・返す、銀行、親になる・降りる(準備フェーズのみ)</li><li><b>「戻す」ボタン</b>: 直前の1操作を取り消します。賭けの最中は、「取り消す」(自分のベット)、代表者は「全員に返す」になります</li><li><b>☰メニュー</b>: ログ、ルームを共有、ミニゲーム、代表者を移す、退出、最終精算、通信の状態</li></ul><p>通信がうまくいかないときは、☰の「通信の状態」で、直近のエラーを確認できます。エラーで何も操作できなくなったときだけ、☰のいちばん下の「この端末だけ抜ける」を使えます(あとから戻ることはできません。コインはルームに残ります)。</p></section>
<section><h2>ターンとログ</h2><p>賭け→結果の1サイクルを「1ターン」と数えます。準備中の送金・貸し借り・銀行などは、ターンの間として「ターン1.5」のように、見るだけの記録が残ります。ログは、☰メニューの「ログ」で見られます。</p><ul><li><b>未</b>: まだ変わるもの。ベット中、保留した賭け、承認待ちの申請</li><li><b>済</b>: 確定したもの。あとから変えられません。間違えたときは、「戻す」(直前の1回だけ)か、差額を動かす新しい操作で直します</li><li><b>取消</b>: 「戻す」で取り消された操作</li></ul><p>「未」の行からは、そのまま承認や、保留の処理ができます。</p></section>
<section><h2>保留</h2><p>結果が出るのが別のタイミングのときは、結果入力の画面で「あとで入力する(保留)」を選びます。コインはポットに入ったまま準備フェーズに戻り、画面に「保留中」のカードが出ます。保留中でも、別の賭けを始められます。結果が出たら、カードをタップして入力します(準備フェーズにできます)。</p><ul><li>保留中の賭けがある人は、退出できません</li><li>「親と勝負」の保留があるあいだは、親を降りられません</li><li>保留が残っていても、最終精算で全部返金して精算できます</li></ul></section>
<section><h2>ミニゲーム(ルーレット)</h2><p>代表者が、☰メニューの「ミニゲーム」→「ルーレット」で始めます。1回で1ターンです。</p><ul><li>賭けた人ごとに円盤の枠ができ、<b>賭け額が多いほど枠が広く</b>なります(全体が100%)。数字を変えるたびに、円盤も変わります</li><li>代表者が「回す」を押すと、円盤が回って、止まった枠の人が<b>ポット全部をもらいます</b>。回す前なら、賭け額の<b>上乗せ</b>も、取り消しもできます</li><li>回したあとは、<b>取り消せません</b>(「戻す」も使えません)</li><li>賭けた人が1人だけのときは、回さずに返金します</li></ul></section>

function fnUp(){const n=$('#fn'),p=$('#fp');if(!n||!p)return;const o=p.options[p.selectedIndex];n.innerHTML=(o?esc(o.text):'')+' さんに「'+KD[FK][0]+'」を申請します。<br>相手が承認すると成立します。'}
function pSheet(k){const p=S.p[k];if(!p)return;const pr=S.ph==='prep',d=debtInfo(k);
 sheet(`<h3>${esc(p.n)} さん</h3><div class=cf>残高 <b>${fmtC(p.c)}</b>${d?'<br>'+d:''}</div>${pr?['send','lend','borrow'].map(x=>`<button class="${x==='send'?'ok':'ln'}" onclick="pk('${x}','${k}')">コインを${KD[x][0]}(${KD[x][1]})</button>`).join(''):'<div class=cf>コインのやり取りは、準備フェーズにできます</div>'}`)}
function pk(x,k){FK=x;coinMenu();const s=$('#fp');if(s){s.value=k;fnUp()}}
function fm(){sheet(`<h3>親になる(ハウスへ入れる額)</h3><div class=cf>ハウスに入れたコインが、ほかの人への支払いの元手になります。降りるときに、残りが戻ります。</div><input id=fa class=amt type=number inputmode=numeric placeholder="金額">${chipsH()}<button class=ok onclick="fokT()">入金して親になる</button>`)}
function fok(){const a=+$('#fa').value,t=$('#fp')?$('#fp').value:null;closeSheet();act(FK,{to:t,amt:a})}
function fokT(){const a=+$('#fa').value;closeSheet();act('take',{amt:a})}
function bank(d){closeSheet();act('bank',{d:d})}
function initSheet(){sheet(`<h3>初期コイン</h3><div class=cf>全員のスタート時のコインです。ゲーム開始前に決めます(いまは ${fmtC(S.ic||10000)})。銀行から借りられる1回の額も、この額になります。</div><input id=fa class=amt type=number inputmode=numeric value="${S.ic||10000}"><button class=ok style="margin-top:10px" onclick="closeSheet();act('setInit',{amt:+$('#fa').value})">この額に変更</button>`)}
function startSheet(){const hs=!!S.hs.o;
 sheet(`<h3>どちらで賭けますか?</h3>
 <button class="mode m1" onclick="closeSheet();act('start',{md:'game'})"><b>👥 みんなで勝負</b><span class=t>プレイヤー同士で勝ち負けを決める</span><small>例: ポーカー・大富豪・ババ抜き<br>全員のベットが「ポット」に集まり、勝った人が受け取ります</small></button>
 <button class="mode m2" onclick="${hs?'startH()':'needHouse()'}"><b>🎩 親と勝負</b><span class=t>親(胴元)と、当たり外れで勝負する</span><small>例: ルーレット・サイコロ・ブラックジャック<br>当たれば「ベット × 倍率」を親からもらいます${hs?'':'<br><em>※先に親が必要です(タップで案内)</em>'}</small></button>
 <details class=dt><summary>どっちか迷ったら</summary><div class=ex>・参加者どうしで勝ち負けを決める → <b>みんなで勝負</b><br>・親役がいて、当たり外れで決める → <b>親と勝負</b><br>・それでも迷う → <b>みんなで勝負</b>(結果入力で、人ごとに自由な額を配れます)</div></details>`)}
function startH(){closeSheet();act('start',{md:'house'})}
function needHouse(){sheet(`<h3>先に「親」が必要です</h3><div class=cf><b>親と勝負</b>は、親(胴元)が1人いて、ほかの人が親と勝負する賭け方です。親は、ハウスにコインを入れて始めます。</div><div class=ex>手順<br>① 「コイン」→「親になる」<br>② ハウスに入れる額を決める<br>③ もう一度「賭けを始める」→「親と勝負」</div><button class=ok onclick="fm()">自分が親になる</button><button class=ln onclick="startSheet()">← 賭け方を選びなおす</button>`)}
function betSheet(){const c=P().c,ro=S.md==='roulette',mb=S.bt[me];
 sheet(`<h3>${ro&&mb!=null?'上乗せ(いま '+fmtC(mb)+' / 残高 '+fmtC(c)+')':'ベット('+MIN+'以上 / 残高'+fmtC(c)+')'}</h3>${ro?'<div class=pv><div class=wp style="width:120px"><div class=ptr></div><div id=pvw class=wh></div></div><div id=pvt class=pvt></div></div>':''}<input id=fa class=amt type=number inputmode=numeric value="${Math.min(MIN,c)}"${ro?' oninput=pvUpd()':''}>${chipsH()}${canBet()?`<button class=ok onclick="closeSheet();act('bet',{amt:+$('#fa').value})">${ro&&mb!=null?'上乗せする':'ベットする'}</button>`:''}${isH()&&!ro?`<details class=dt><summary>代表者の操作</summary><button onclick="closeSheet();act('betAll',{amt:+$('#fa').value})">全員に同じ額を賭けさせる</button><button class=ln onclick="closeSheet();act('close')">ベットせず締め切る</button></details>`:''}${isH()&&ro?`<details class=dt><summary>代表者の操作</summary><button onclick="closeSheet();act('betAll',{amt:+$('#fa').value})">全員に同じ額を賭けさせる</button></details>`:''}<small>足りないときは「コイン」から借りて、準備フェーズで備えます</small>`);if(ro)pvUpd()}
function resSheet(id){const r=id?S.pd.find(x=>x.id===id):null;if(id&&!r)return toast('保留が見つかりません');
 const bt=r?r.bt:S.bt,md=r?r.md:S.md;RP=Object.values(bt).reduce((a,b)=>a+b,0);const hd=id?'':`<button class=ln onclick="hold()">あとで入力する(保留)</button>`;
 if(md==='game')return sheet(`<h3>配分を入力(ポット ${fmtC(RP)})</h3><div id=sm class=rem></div><div class=cf>1人ずつ、もらう金額を入れます。合計がポットとぴったり合うと、確定できます。</div><div class=g4><button class=ln onclick="retAll('${id||''}')">全員にベットを返す(引分)</button><button class=ln onclick="splitEq('${id||''}')">ベットした人で均等に分ける</button></div>${Object.keys(bt).concat(Object.keys(S.p).filter(k=>bt[k]==null)).map(k=>`<div class=pr><div class=pt><b>${esc(S.p[k].n)}</b><small>${bt[k]!=null?'ベット '+fmtC(bt[k]):'ベットなし'}</small></div><div class=pi><input class=al data-k=${k} type=number inputmode=numeric placeholder=0 oninput=sum()><button class=ln onclick="all1('${k}')">総取り</button><button class=ln onclick="rest('${k}')">残り→</button></div></div>`).join('')}<button class=ok id=okb onclick="resG('${id||''}')">配分を確定</button>${hd}`)||sum();
 sheet(`<h3>結果を入力(親と勝負)</h3>${Object.keys(bt).map(k=>`<div class=hr data-k=${k}><div>${esc(S.p[k].n)} ${fmtC(bt[k])}</div><div class=seg3><button data-v=l onclick="pickR(this)">ハズレ</button><button class=ln data-v=w onclick="pickR(this)">当たり</button><button class=ln data-v=d onclick="pickR(this)">引分</button></div><input class=rm type=number step=any value=2 hidden></div>`).join('')}<div class=cf>当たり = ベット×倍率をハウスから払います(足りなければ払える分まで)</div><button class=ok onclick="resH('${id||''}')">結果を確定</button>${hd}`)}
function sum(){const t=[...document.querySelectorAll('.al')].reduce((a,i)=>a+(+i.value||0),0),r=RP-t,e=$('#sm');if(!e)return;e.textContent=r===0?'ぴったり! 確定できます':'残り '+fmtC(r);e.style.color=r===0?'#1a9d57':r<0?'#d9412f':'';const b=$('#okb');if(b)b.disabled=r!==0}
function btOf(id){return id?(S.pd.find(x=>x.id===id)||{bt:{}}).bt:S.bt}
function retAll(id){const bt=btOf(id);document.querySelectorAll('.al').forEach(i=>i.value=bt[i.dataset.k]||'');sum()}
function splitEq(id){const bt=btOf(id),ins=[...document.querySelectorAll('.al')];ins.forEach(i=>i.value='');const w=ins.filter(i=>bt[i.dataset.k]!=null);if(!w.length)return;const b=Math.floor(RP/w.length);w.forEach(i=>i.value=b);w[0].value=b+RP-b*w.length;sum()}
function all1(k){document.querySelectorAll('.al').forEach(i=>i.value=i.dataset.k===k?RP:'');sum()}
function rest(k){const ins=[...document.querySelectorAll('.al')],r=RP-ins.reduce((a,i)=>a+(+i.value||0),0),i=ins.find(x=>x.dataset.k===k);if(i&&r>0)i.value=(+i.value||0)+r;sum()}
function pickR(b){b.parentNode.querySelectorAll('button').forEach(x=>x.className=x===b?'':'ln');b.closest('.hr').querySelector('.rm').hidden=b.dataset.v!=='w'}
function hold(){closeSheet();act('hold')}
function resG(id){const al={};document.querySelectorAll('.al').forEach(i=>al[i.dataset.k]=Math.round(+i.value||0));closeSheet();id?act('resP',{id:id,al:al}):act('resG',{al:al})}
function resH(id){const rs={};document.querySelectorAll('.hr').forEach(h=>{const v=h.querySelector('.seg3 button:not(.ln)');rs[h.dataset.k]={r:v?v.dataset.v:'l',m:+h.querySelector('.rm').value}});closeSheet();id?act('resP',{id:id,rs:rs}):act('resH',{rs:rs})}
function menu(){const u=openN(),h=isH(),pp=S.ph==='prep',lb=S.ph==='lobby',mi=(ic,t,fn,sm)=>`<button class=mi onclick="${fn}"><span class=ic>${ic}</span>${t}${sm?`<small>${sm}</small>`:''}</button>`;
 const g=[h&&pp?mi('🎡','ミニゲーム','miniSheet()','ルーレット'):'',h&&Object.keys(S.p).length>1?mi('👑','代表者を移す','giveSheet()',''):'',pp||lb?mi('🚪','退出',"if(confirm('退出しますか?'))leave()",''):''].join('');
 sheet(`<h3>メニュー</h3><div class=sec>記録・共有</div>${mi('📋','ログ','logSheet()',u?'未 '+u+'件':'')}${mi('🔗','ルームを共有','share()','')}${g?'<div class=sec>ゲーム・ルーム</div>'+g:''}${h&&pp?`<div class=dz><div class=sec>⚠ 取り扱い注意</div><button class=dg onclick="settleAsk()">最終精算(ゲームを終わらせる)</button></div>`:''}<div class=sec>その他</div>${mi('📶','通信の状態','netSheet()','成功 '+NET.ok+' / 失敗 '+NET.ng)}<button class=tiny onclick="forceOut()">この端末だけ抜ける(エラー時用)</button>`)}
function netSheet(){const t2=n=>String(n).padStart(2,'0'),e=NET.errs.map(x=>{const d=new Date(x.t);return'<div class=it>'+t2(d.getHours())+':'+t2(d.getMinutes())+':'+t2(d.getSeconds())+' '+esc(x.k)+'</div>'}).join('');
 sheet(`<h3>通信の状態</h3><div class=it>成功 ${NET.ok}回 / 失敗 ${NET.ng}回</div><div class=it>直近の応答時間 ${NET.ms}ms</div><div class=gh>最近のエラー(新しい順)</div>${e||'<p>エラーはありません</p>'}<small>うまくいかないときは、この画面の内容を教えてください</small>`)}
function forceOut(){if(!confirm('これは、エラーで操作できなくなったとき専用の機能です。普段は絶対に使いません。\n\nこの端末はルームから抜けます。あとから戻ることはできません。コインはルームに残ります。\n\n本当に抜けますか?'))return;UAB=true;if(CUR)CUR.abort();busy=false;spin(false);reset()}
function miniSheet(){sheet(`<h3>ミニゲーム</h3><button class=ok onclick="closeSheet();act('mini',{g:'roulette'})">🎡 ルーレット</button><button class=ln disabled>🎲 サイコロ(準備中)</button><small>ミニゲームは1回で1ターンです。回したあとは取り消せません</small>`)}
function settleAsk(){const n=S.pd.length;if(confirm(n?'保留中の賭けが'+n+'件あります。全部返金して、最終精算します。借金を引いた最終コイン数で順位を発表します。よろしいですか?':'最終精算します。借金を引いた最終コイン数で順位を発表します。よろしいですか?')){closeSheet();act('settle',n?{rf:1}:{})}}
function pendSheet(id){const r=S.pd.find(x=>x.id===id);if(!r)return;const can=canRes(r),pr=S.ph==='prep';
 sheet(`<h3>ターン${r.n} 保留中(${r.md==='house'?'親と勝負':'みんなで勝負'})</h3><div class=cf>ポット <b>${fmtC(pdSum(r))}</b></div>${Object.keys(r.bt).map(k=>`<div class=it>${esc(S.p[k]?S.p[k].n:'?')} <b>${fmtC(r.bt[k])}</b></div>`).join('')}<div style="height:10px"></div>${can&&pr?`<button class=ok onclick="closeSheet();resSheet('${r.id}')">結果を入力</button>`:can?'<small>結果の入力は、準備フェーズにできます</small>':'<small>結果は'+(r.md==='house'?'親か代表者':'代表者')+'が入力します</small>'}${isH()&&pr?`<button class=dg onclick="if(confirm('この賭けを全員に返金して取りやめますか?')){closeSheet();act('cancelP',{id:'${r.id}'})}">返金して取りやめ</button>`:''}`)}
function fmtN(n){return Number.isInteger(n)?'ターン'+n:'ターン'+n+'(ターンの間)'}
function logSheet(f){if(f)LF=f;const all=LF==='all',ls=S.lg.filter(e=>all||e.s===0),G={};ls.forEach(e=>(G[e.n]=G[e.n]||[]).push(e));
 const ks=Object.keys(G).map(Number).sort((a,b)=>b-a),tm=t=>{if(!t)return'';const d=new Date(t*1000);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
 const mk=e=>e.s===0?'<span class=mk>未</span>':e.s===2?'<span class="mk x">取消</span>':'<span class="mk dn">済</span>';
 const ac=e=>{if(e.s!==0)return'';if(e.k==='q'){const r=S.rq.find(x=>x.id===e.r);if(!r)return'';const ot=r.by===r.f?r.t:r.f;return ot===me?`<div class=r2><button class=ok onclick="rq('approve','${r.id}')">承認</button><button class=ln onclick="rq('reject','${r.id}')">断る</button></div>`:r.by===me?`<button class=ln onclick="rq('reject','${r.id}')">取り消す</button>`:''}
  return S.pd.some(x=>x.id===e.r)?`<button class=ln onclick="pendSheet('${e.r}')">処理する ›</button>`:''};
 const row=e=>`<div class="it${e.s===2?' xx':''}">${mk(e)}${e.z?`<span class=zz>${esc(e.z)}</span>`:''} ${esc(e.x)}<small>${tm(e.t)}</small>${e.d?'<div class=dl>'+e.d.map(a=>esc(a[0])+' <b class='+(a[1]>0?'pl':'mn')+'>'+(a[1]>0?'+':'')+a[1]+'</b>').join(' / ')+'</div>':''}${ac(e)}</div>`;
 sheet(`<h3>ログ</h3><div class=seg2><button class="${all?'ln':''}" onclick="logSheet('open')">未だけ</button><button class="${all?'':'ln'}" onclick="logSheet('all')">すべて</button></div>${ks.length?ks.map(n=>`<div class=gh>${fmtN(n)}</div>${G[n].map(row).join('')}`).join(''):'<p>未処理はありません</p>'}${S.lt?`<small>古いログ ${S.lt}件は省略されました</small>`:''}`)}
async function rq(a,id){await act(a,{id:id});if(S)logSheet()}
async function leave(){closeSheet();const r=await act('leave');if(r&&!r.err)reset()}
function giveSheet(){sheet(`<h3>代表者を移す</h3>${Object.keys(S.p).filter(k=>k!==me).map(k=>`<button onclick="giveTo('${k}')">${esc(S.p[k].n)}</button>`).join('')}`)}
function giveTo(k){if(confirm(S.p[k].n+' さんに代表者を移しますか?')){closeSheet();act('giveHost',{to:k})}}
async function share(){const u=location.origin+location.pathname+'?room='+S.id;
 try{if(navigator.share)return await navigator.share({title:'コインプラット',text:'ルームコード '+S.id,url:u});await navigator.clipboard.writeText(u);toast('URLをコピーしました')}catch(e){if(e&&e.name==='AbortError')return;sheet(`<h3>ルームコード ${S.id}</h3><input readonly value="${esc(u)}" onclick="this.select()">`)}}
function copyRes(){const t=(S.res||[]).map((r,i)=>(i+1)+'位 '+r.n+' '+r.f).join(' / ');try{navigator.clipboard.writeText(t).then(()=>toast('結果をコピーしました'),()=>toast('コピーできませんでした'))}catch(e){toast('コピーできませんでした')}}
function ended(){closeSheet();const rk=S.res||[];document.body.removeAttribute('data-ph');
 $('#app').innerHTML=`<div class=home><h1>最終結果</h1><p>借金を引いた最終コイン数です</p>${rk.map((r,i)=>`<div class="row ${r.id===me?'me':''}"><div class=n>${i+1}位 ${esc(r.n)}<small>残高 ${fmtC(r.c)} / 銀行借入 -${fmtC(r.b)}</small></div><b>${fmtC(r.f)}</b></div>`).join('')}<br><button onclick="copyRes()">結果をコピー</button><button class=b2 onclick="reset()">ホームに戻る</button></div>`;
 if(!acked){acked=true;post({a:'ack',r:rid,p:me});rid=null;sv(null)}}
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input[type=number]'))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button')){try{navigator.vibrate&&navigator.vibrate(8)}catch(x){}}});
let polling=false;
const pollGap=()=>(Date.now()<fastUntil||(S&&S.rq&&S.rq.length))?1500:2500;
async function poll(){if(!rid||busy||!S||polling||document.hidden)return;polling=true;const my=rid;try{const r=await req(API+'?r='+my+'&v='+S.v,{},12000);
 if(r.net){if(++NET.cf===3)toast('通信が不安定です。自動で再接続を試みます');return}NET.cf=0;
 if(!rid||rid!==my||!S||S.ph==='ended')return;
 if(r.err==='gone'){toast('ルームが終了しました');reset()}else if(r.s&&r.s.v>S.v){if(!r.s.p[me])return reset();S=r.s;if(!$('#sh').hidden&&S.ph!==(window._ph||S.ph))closeSheet();window._ph=S.ph;render()}}catch(e){}finally{polling=false}}
(function tick(){poll();setTimeout(tick,pollGap())})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
async function boot(){const o=ld();if(!(o.rid&&o.me))return home();
 $('#app').innerHTML='<div class=home><p>接続中…</p></div>';
 let r=null;for(let i=0;i<4;i++){const j=await req(API+'?r='+o.rid+'&v=0',{},12000);if(!j.net){r=j;break}await sleep(1500)}
 if(r&&r.s&&r.s.p[o.me]){S=r.s;me=o.me;rid=o.rid;window._ph=S.ph;return render()}
 if(r){sv(null);return home()}
 $('#app').innerHTML='<div class=home><h1>接続できません</h1><p>通信が不安定なようです'+(NET.errs[0]?'('+esc(NET.errs[0].k)+')':'')+'。前回のルームの情報は残してあります。</p><button onclick="boot()">もう一度つなぐ</button><div style="height:16px"></div><button class=b2 onclick="sv(null);home()">ホームへ(前回のルームは忘れる)</button></div>'}
boot();
</script></body></html>
