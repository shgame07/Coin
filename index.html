<style>

.home input{width:100%;height:52px;border-radius:12px;border:2px solid var(--line);padding:0 14px;margin-bottom:10px;background:#fff;color:var(--ink)}
.home button{width:100%;height:52px;border-radius:12px;border:0;margin-bottom:10px;background:var(--top);color:#fff;font-weight:700;box-shadow:0 3px 0 var(--top2)}
.home .b2{background:var(--card);color:var(--acc);border:2px solid var(--acc);box-shadow:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:9;max-width:90%}#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.pn{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

<script>
const API='https://script.google.com/macros/s/AKfycbwDoBowKR2yK_MLBjjTrm9XKmmj_hmjY0X65CBUWa7_2gLg5lvoSoyhffpedNyKQXDnoQ/exec',MIN=100,BANK=10000;

let S=null,me=null,rid=null,busy=false,acked=false,pc=null,lockUntil=0,PS=null,twT=0;

const ld=()=>{try{return JSON.parse(localStorage.getItem('cm'))||{}}catch(e){return{}}};
const sv=o=>{try{o?localStorage.setItem('cm',JSON.stringify(o)):localStorage.removeItem('cm')}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
async function post(o){try{return await(await fetch(API,{method:'POST',body:JSON.stringify(o)})).json()}catch(e){return{err:'通信に失敗しました'}}}
async function act(a,o={}){if(busy||Date.now()<lockUntil)return;busy=true;spin(true);const r=await post(Object.assign({a:a,r:rid,p:me},o));busy=false;lockUntil=Date.now()+200;spin(false);
  if(r.err==='gone'){if(a!=='leave')toast('ルームが見つかりません');return reset()}
  if(r.err)toast(r.err);if(r.s){S=r.s;if(!S.p[me])return r;render()}return r}
let ldT=null;function spin(on){clearTimeout(ldT);document.body.classList.toggle('busy',on);if(on)ldT=setTimeout(()=>$('#ld').hidden=false,250);else $('#ld').hidden=true}
function reset(){S=null;me=rid=null;pc=null;PS=null;acked=false;sv(null);closeSheet();home()}
async function enter(a,name,code){if(busy||Date.now()<lockUntil)return;busy=true;code=String(code||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).trim();spin(true);const r=await post({a:a,n:name,r:code});busy=false;lockUntil=Date.now()+200;spin(false);if(r.err)return toast(r.err);try{localStorage.setItem('cmn',name)}catch(e){}S=r.s;me=r.p;rid=r.r;sv({rid:rid,me:me});render()}
let NAME='';const savedName=()=>{try{return localStorage.getItem('cmn')||''}catch(e){return''}};
function home(){NAME=NAME||savedName();
 $('#app').innerHTML=`<div class=home><h1>コインプラット</h1><p>ポーカーなどのコインを、みんなのスマホで管理します。</p>
 <label class=lb>プレイヤー名</label><input id=nm maxlength=12 placeholder="名前を入力" value="${esc(NAME)}">
 <button onclick="nameOk()">決定</button><div style="height:40px"></div><button class=b2 onclick="guide(home)">使い方</button></div>`}
function nameOk(){const n=$('#nm').value.trim();if(!n)return toast('名前を入力してください');NAME=n;try{localStorage.setItem('cmn',n)}catch(e){}choose()}
function choose(){const q=new URLSearchParams(location.search).get('room')||'';
 $('#app').innerHTML=`<div class=home><h1>${esc(NAME)} さん</h1><p>ルームを作るか、コードで参加します。</p>
 <button onclick="enter('create',NAME)">ルームを作る</button><div style="height:24px"></div>
 <label class=lb>ルームコード(4桁)</label><input id=cd inputmode=numeric maxlength=4 placeholder="1234" value="${esc(q)}"><button class=b2 onclick="enter('join',NAME,$('#cd').value)">ルームに参加</button>
 <div style="height:24px"></div><button class=b2 onclick="home()">← 名前を変える</button></div>`}
let GB=null;
function guide(b){GB=b;$('#app').innerHTML=`<div class=guide><button onclick="GB()">← 戻る</button><h1>使い方</h1>
<section><h2>このサイトでできること</h2><p>ポーカーなどで使うコインを、みんなのスマホで管理します。実物のコインを持ち運ぶ必要はありません。全員の残高・ポット・借金が、同じ画面でリアルタイムに共有されます。</p><ul><li>最大8人まで。全員が同じコインでスタート(初期値は10,000。代表者が、ゲーム開始前に「初期コイン」ボタンで変更できます)</li><li>ログイン不要。同じ端末で開き直すと、自動でルームに戻ります</li></ul></section>
<section><h2>全体の流れ</h2><ul><li>① ホームで名前を入れて「決定」</li><li>② 「ルームを作る」か、コードで「ルームに参加」</li><li>③ 全員が揃ったら、代表者が「ゲーム開始」</li><li>④ 準備 → 賭け → 結果 を、何度でも繰り返す</li><li>⑤ 代表者が最終精算 → 借金を引いた順位を発表</li></ul><p>ルームへの招待は、☰メニューの「ルームを共有」でURLを送るだけです。開始後の途中参加もできます。</p></section>
<section><h2>3つのフェーズ</h2><ul><li><b>準備</b>: 送金・貸し借り・銀行借入・親の交代など、コインのやり取りをする時間。ここでしかできません</li><li><b>賭け</b>: 全員がベットする時間。最低100コインから、金額は自由。残高が足りない人は、準備のうちに借りておきます</li><li><b>結果</b>: ポットの配分や、当たり外れを入力して、コインを動かす時間。終わると準備に戻ります</li></ul><p>賭けの途中は送金や借入ができないので、残高が食い違いません。</p></section>
<section><h2>ポットとは</h2><p>賭けられたコインを一時的に集めておく場所です。2種類あります。</p><p><b>① ゲームポット</b>(プレイヤー同士の勝負)<br>全員のベットが1つのポットに集まり、結果フェーズで、実際のコイン数を指定して配ります。「総取り」ボタンで、1人に全額を渡せます。2位以下にも配るときは、人ごとに数字を入れます。合計がポットと一致しないと確定できません。</p><p><b>② ハウスポット</b>(親との勝負 = 倍率)<br>親の持ち金です。詳しくは次の「親」を見てください。</p></section>
<section><h2>親とは</h2><p>「親」は、倍率ゲームの胴元です。同時に1人だけで、準備フェーズに「コイン → 親になる」で、ハウスポットへコインを入れて始めます。</p><ul><li>ハズレのベットは、ハウスポットに入ります</li><li>当たりの人には「ベット × 倍率」が、ハウスポットから払われます(2倍なら、賭けた額の2倍)</li><li>引き分けは、ベットがそのまま返ります</li><li>ハウスポットが足りないときは、払える分までです</li><li>親は、自分の賭けには参加できません</li><li>「親を降りる」と、ハウスポットの残りが全額、その人に戻ります。親の交代はこの方法で行います</li></ul><p>結果の入力は、親か代表者が行います。</p></section>
<section><h2>どっちを使う?(おすすめ)</h2><div class=rec><b>ゲームポット がおすすめ</b><br>ポーカー、大富豪、ババ抜きなど、プレイヤー同士で勝ち負けを決めるゲーム</div><div class=rec><b>倍率(親あり) がおすすめ</b><br>ルーレット、サイコロの目当て、ブラックジャック(親がディーラー)、「当たったら2倍」の自作ゲーム</div><p>どちらでも、賭けを始めるときに選べます。</p></section>
<section><h2>貸し借りと銀行</h2><ul><li><b>送金・貸す・借りる・返す</b>は、申請を出して、相手が承認すると成立します。間違いを防ぐためです。申請は、☰メニューの「申請」で確認できます(届くと画面に知らせが出ます)</li><li><b>銀行</b>は、初期コインと同じ額(初期値は10,000)ずつ、いつでも借りられます。上限も利息もありません。ただし、最終精算でその分が引かれます</li><li>プレイヤー同士の借金は、最終精算で、貸した人に加算、借りた人から減算されます</li></ul></section>
<section><h2>代表者の役目</h2><p>ルームを作った人が代表者です。ゲーム開始、賭けの開始と締め切り、ポットの配分、最終精算を担当します。「全員に同じ額を賭けさせる」も使えるので、みんながスマホを触らなくても進められます。代表者は、☰メニューの「代表者を移す」で、ほかの人に交代できます。</p></section>
<section><h2>画面の見方</h2><ul><li><b>上のバー</b>: 今のフェーズ(準備・賭け・結果)と、ルームコード。☰はメニューです</li><li><b>あなたのコイン</b>: 自分の残高です。増えると緑、減ると赤に光り、コインが動いて増減を伝えます</li><li><b>メッセージ</b>: 今なにをする場面か、誰を待っているかを表示します</li><li><b>大きいボタン</b>: 今のフェーズで次にやること。下の小さな文字が、押すと何が起こるかの説明です。押せないときは点線の枠になり、待っている理由が出ます</li><li><b>左「コイン」</b>: 準備フェーズのやり取り(送金・貸し借り・銀行・親)</li><li><b>右「戻す」</b>: 直前の1操作を取り消します。賭けの最中は、「取り消す」(自分のベット)、代表者は「全員に返す」になります</li><li><b>☰</b>: 申請、履歴、共有、退出、代表者の移譲、最終精算</li></ul></section>
<section><h2>最終精算</h2><p>準備フェーズに、代表者が☰メニューから行います。</p><p>最終コイン数 = 残高 − 銀行の借入 − 借りた分 + 貸した分</p><p>この数字で順位が決まります。結果を全員が見たあと、ルームのデータは自動で削除されます。必要なら、「結果をコピー」で保存してください。</p></section>
<button onclick="GB()">← 戻る</button></div>`}
const P=()=>S.p[me],isH=()=>S.h===me;
const opts=()=>Object.keys(S.p).filter(k=>k!==me).map(k=>`<option value=${k}>${esc(S.p[k].n)}</option>`).join('');
const debtInfo=k=>{const l=S.d.filter(d=>d.l===k).reduce((a,d)=>a+d.a,0),b=S.d.filter(d=>d.b===k).reduce((a,d)=>a+d.a,0),t=[];if(S.p[k].b)t.push('銀行 -'+S.p[k].b);if(b)t.push('借 -'+b);if(l)t.push('貸 +'+l);return t.join(' / ')};
const pot=()=>Object.values(S.bt).reduce((a,b)=>a+b,0);

function waitN(){return Object.keys(S.p).filter(k=>S.bt[k]==null&&!(S.md==='house'&&S.hs.o===k)&&S.p[k].c>0).length}
function msg(){const h=isH(),ph=S.ph;
 if(ph==='lobby')return h?'全員が入ったら「ゲーム開始」を押します(いま'+Object.keys(S.p).length+'人)':'代表者がゲームを始めるのを待っています';
 if(ph==='prep')return h?'コインのやり取りは、いまのうちに。準備ができたら「賭けを始める」':'コインのやり取りは、いまのうちに。代表者が賭けを始めます';
 if(ph==='bet'){const n=waitN();if(S.bt[me]==null&&canBet())return'あなたのベット額を決めてください';return n?'あと'+n+'人のベットを待っています':(h?'全員そろいました。「締め切る」を押します':'全員そろいました。代表者が締め切ります')}
 const ok=S.md==='house'?(me===S.hs.o||h):h;
 return ok?'結果を入力してください。終わると準備に戻ります':(S.md==='house'?'親か代表者が、当たり外れを入力しています':'代表者が、ポットの配分を入力しています')}
function smb(l,c,fn,why){return`<button class="sm${fn?'':' off'}" onclick='${fn||'toast("'+why+'")'}'><b>${l}</b><i>${c}</i></button>`}
function render(){if(!S)return;if(S.phase==='ended'||S.ph==='ended')return ended();
 const old=PS,nw=snap(),OP=old?anchors():{};PS=nw;const chg=old&&!RM()?Object.keys(nw.c).filter(k=>k in old.c&&nw.c[k]!==old.c[k]):[];
 const nb=mine().length,[mt,mf,md,mcap]=mainBtn(),bk=backBtn(),lb=S.ph==='lobby',pr=S.ph==='prep';
 const dc=pc==null?0:P().c-pc;pc=P().c;const cls=dc>0?'up':dc<0?'dn':'';
 const pots=(S.ph!=='prep'&&S.bt?`<div class=pot id=potbox>${S.md==='house'?'賭け金':'ゲームポット'}<b>${pot()}</b></div>`:'')+(S.hs.o?`<div class=pot id=hsbox>ハウス(親: ${esc(S.p[S.hs.o].n)})<b>${S.hs.c}</b></div>`:'');
 const oth=Object.keys(S.p).filter(k=>k!==me).map(k=>{const p=S.p[k];return`<div class="row${chg.indexOf(k)>=0?' fl':''}" data-k="${k}"><div class=n>${esc(p.n)}${k===S.h?' (代表)':''}${k===S.hs.o?' (親)':''}<small>${S.bt&&S.bt[k]!=null?'ベット '+S.bt[k]+' ':''}${debtInfo(k)}</small></div><b>${p.c}</b></div>`}).join('');
 const stp=lb?'':['prep','bet','result'].map(k=>`<span class="stp ${S.ph===k?'on':''}">${PH[k]}</span>`).join('');
 const sub=[(S.bt&&S.bt[me]!=null?'ベット '+S.bt[me]:''),debtInfo(me)].filter(Boolean).join('<br>');
 const L=lb?smb('初期コイン','開始額を変更',isH()?'initSheet()':'','初期コインは代表者だけが変えられます'):smb('コイン','送金・借入・親',pr?'coinMenu()':'','コインのやり取りは、準備フェーズだけです');
 const R=bk?smb(bk[0],bk[2],bk[1]):smb('戻す','直前の操作を取消','','いま戻せる操作はありません');
 const B=md?`<button class=big onclick='${mf}'>${mt}</button>`:`<div class="big wait">${mt}</div>`;
 $('#app').innerHTML=`<div class=top><div class=tl><div class=ttl>${TT[S.ph]}</div>${stp?`<div class=st>${stp}</div>`:''}</div><div class=rc>ルーム<b>${S.id}</b></div><button class=ib onclick="menu()">☰${nb?`<span class=bg>${nb}</span>`:''}</button></div>
 <div class=mc id=mycard><div><div class=mlab>あなたのコイン${isH()?' (代表)':''}${S.hs.o===me?' (親)':''}</div><div class="mnum ${cls}">${P().c}</div></div><div class=msub>${sub}</div></div>
 ${nb?`<div class=notice onclick="reqs()">申請が${nb}件 届いています(タップで確認)</div>`:''}<div class=msg>${msg()}</div>
 <div class=mid>${lb?'<div class=pot style="margin-bottom:10px">ルームコード<b>'+S.id+'</b>初期コイン '+(S.ic||10000)+'</div>':''}${pots?`<div class=pots>${pots}</div>`:''}${oth||'<div class=emp>ほかの参加者を待っています。<br>☰の「ルームを共有」で招待できます</div>'}</div>
 <div class=bar>${L}<div class=bw>${B}<div class=cap>${mcap}</div></div>${R}</div>`;after(old,nw,OP)}
const RM=()=>{try{return window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches}catch(e){return false}};
function snap(){const c={},b={};let bt=0;Object.keys(S.p).forEach(k=>{c[k]=S.p[k].c;b[k]=S.p[k].b});Object.values(S.bt||{}).forEach(v=>bt+=v);return{c:c,b:b,pot:bt,house:S.hs.c}}
function flows(o,n){const D={};let bk=0;Object.keys(n.c).forEach(k=>{if(k in o.c){const d=n.c[k]-o.c[k];if(d)D[k]=d;bk-=n.b[k]-o.b[k]}});
 if(n.pot!==o.pot)D.pot=n.pot-o.pot;if(n.house!==o.house)D.house=n.house-o.house;if(bk)D.bank=bk;
 const src=[],snk=[];Object.keys(D).forEach(k=>(D[k]<0?src:snk).push([k,Math.abs(D[k])]));
 const out=[];while(src.length&&snk.length&&out.length<6){const m=Math.min(src[0][1],snk[0][1]);out.push([src[0][0],snk[0][0],m]);src[0][1]-=m;snk[0][1]-=m;if(!src[0][1])src.shift();if(!snk[0][1])snk.shift()}return out}
function pt(sel){const e=document.querySelector(sel);if(!e)return null;const r=e.getBoundingClientRect();return r.width?{x:r.left+r.width/2,y:r.top+r.height/2,s:sel}:null}
function anchors(){const o={pot:pt('#potbox'),house:pt('#hsbox'),bank:pt('.top .ttl')};Object.keys(S.p).forEach(k=>o[k]=pt(k===me?'#mycard':'.row[data-k="'+k+'"]'));return o}
function fly(a,b,n){for(let i=0;i<n;i++){if(document.querySelectorAll('.cn').length>40)return;const e=document.createElement('div');e.className='cn';e.style.left=(a.x-12)+'px';e.style.top=(a.y-12)+'px';document.body.appendChild(e);
 if(!e.animate){e.remove();continue}
 const dx=b.x-a.x,dy=b.y-a.y,jx=(Math.random()-.5)*30,ar=-30-Math.random()*30;
 const an=e.animate([{transform:'translate(0,0) scale(.6)',opacity:0},{transform:'translate('+(dx*.3+jx)+'px,'+(dy*.3+ar)+'px) scale(1.1)',opacity:1,offset:.25},{transform:'translate('+dx*.75+'px,'+(dy*.75+ar/2)+'px) scale(1)',opacity:1,offset:.7},{transform:'translate('+dx+'px,'+dy+'px) scale(.8)',opacity:0}],{duration:750,delay:i*90,easing:'ease-in-out',fill:'both'});
 an.onfinish=()=>e.remove();setTimeout(()=>e.remove(),2500+i*90)}
 setTimeout(()=>{const t=b.s&&document.querySelector(b.s);if(t){t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}},700+(n-1)*90)}
function tween(el,a,b,delay){if(!el)return;const id=++twT;el.textContent=a;const t0=performance.now()+delay,D=600;
 (function f(t){if(id!==twT||!el.isConnected)return;const p=Math.min(1,Math.max(0,(t-t0)/D)),e=1-Math.pow(1-p,3);el.textContent=Math.round(a+(b-a)*e);if(p<1)requestAnimationFrame(f)})(performance.now());
 setTimeout(()=>{if(id===twT&&el.isConnected)el.textContent=b},delay+D+250)}
function after(old,nw,OP){if(!old||RM())return;const oc=old.c[me];if(oc!=null&&oc!==nw.c[me])tween($('.mnum'),oc,nw.c[me],nw.c[me]>oc?450:0);
 const fl=flows(old,nw);if(!fl.length)return;const NP=anchors(),mid={x:innerWidth/2,y:innerHeight/2};
 fl.forEach((f,j)=>{const a=OP[f[0]]||NP[f[0]]||mid,b=NP[f[1]]||OP[f[1]]||mid,n=Math.min(8,Math.max(1,Math.round(Math.log10(Math.max(f[2],1))*1.5)-1));setTimeout(()=>fly(a,b,n),j*120)})}
function canBet(){return!(S.md==='house'&&S.hs.o===me)&&P().c>0}
function mainBtn(){const h=isH();
 if(S.ph==='lobby')return h?['ゲーム開始','act("startGame")',1,'準備フェーズに進みます']:['開始待ち','',0,'代表者が始めるまで待ちます'];
 if(S.ph==='prep')return h?['賭けを始める','startSheet()',1,'賭け方を選んで、ベットの時間へ']:['待機中','',0,'代表者が賭けを始めます'];
 if(S.ph==='bet'){if(S.bt[me]==null&&canBet())return['ベットする','betSheet()',1,'金額を入れて確定します'];return h?['締め切る','act("close")',1,'ベットを確定して結果入力へ']:[S.bt[me]!=null?'ベット済み':S.hs.o===me&&S.md==='house'?'親は待機中':'残高がありません','',0,'ほかの人のベットを待っています']}
 const ok=S.md==='house'?(me===S.hs.o||h):h;return ok?['結果を入力','resSheet()',1,'配分を決めて、準備に戻ります']:['結果待ち','',0,'結果の入力を待っています']}
function backBtn(){if(S.ph==='bet')return isH()?['全員に返す','if(confirm("全員のベットを返しますか?"))act("cancel")','ベットを全員へ返却']:(S.bt[me]!=null?['取り消す','act("withdraw")','自分のベットを戻す']:null);
 return S.hp&&(S.lp===me||isH())?['戻す','act("undo")','直前の操作を取消']:null}
function sheet(h){$('#sh').innerHTML='<div class=bd onclick="closeSheet()"></div><div class=pn>'+h+'<div class=hint>外をタップで閉じる</div></div>';$('#sh').hidden=false}
function closeSheet(){$('#sh').hidden=true}
function coinMenu(){const o=S.hs.o===me;sheet(`<h3>コイン</h3><div class=g><button onclick="fm('send')">送金する</button><button onclick="fm('lend')">貸す</button><button onclick="fm('borrow')">借りる</button><button onclick="fm('repay')">返す</button><button class=ln onclick="bank('borrow')">銀行から${S.ic||10000}借りる</button><button class=ln onclick="bank('repay')">銀行へ${S.ic||10000}返す</button>${!S.hs.o?`<button onclick="fm('take')">親になる</button>`:o?`<button onclick="closeSheet();act('drop')">親を降りる</button>`:''}</div>`)}
function fm(k){const T={send:'送金する',lend:'貸す',borrow:'借りる',repay:'返す',take:'親になる(ハウスへ入れる額)'}[k];
 if(k!=='take'&&!opts())return toast('ほかの参加者がいません');
 sheet(`<h3>${T}</h3>${k==='take'?'':`<label>相手</label><select id=fp>${opts()}</select>`}<label>金額</label><input id=fa type=number inputmode=numeric><button class=ok onclick="fok('${k}')">${k==='take'?'入金して親になる':'申請する'}</button>${k==='take'||k==='repay'?'':'<small>相手が承認すると成立します</small>'}`)}
function fok(k){const a=+$('#fa').value,t=$('#fp')?$('#fp').value:null;closeSheet();act(k,{to:t,amt:a})}
function bank(d){closeSheet();act('bank',{d:d})}
function initSheet(){sheet(`<h3>初期コイン</h3><p>全員のスタート時のコインです。ゲーム開始前に決めます(いまは ${S.ic||10000})。銀行から借りられる1回の額も、この額になります。</p><input id=fa type=number inputmode=numeric value="${S.ic||10000}"><button class=ok onclick="closeSheet();act('setInit',{amt:+$('#fa').value})">この額に変更</button>`)}
function startSheet(){sheet(`<h3>賭けを始める</h3><button class=ok onclick="closeSheet();act('start',{md:'game'})">ゲームポット(ポーカーなど)</button><button onclick="${S.hs.o?'startH()':'needHouse()'}">倍率(親と勝負)</button>`)}
function startH(){closeSheet();act('start',{md:'house'})}
function needHouse(){sheet(`<h3>先に親が必要です</h3><p>倍率は、親(胴元)と勝負するモードです。親になる人が、準備フェーズの「コイン → 親になる」で、ハウスにコインを入れてから始めます。</p><button class=ok onclick="fm('take')">自分が親になる</button><button class=ln onclick="startSheet()">戻る</button>`)}
function betSheet(){const c=P().c;sheet(`<h3>ベット(${MIN}以上 / 残高${c})</h3><input id=fa type=number inputmode=numeric value="${Math.min(MIN,c)}">${canBet()?`<button class=ok onclick="closeSheet();act('bet',{amt:+$('#fa').value})">ベットする</button>`:''}${isH()?`<button onclick="closeSheet();act('betAll',{amt:+$('#fa').value})">全員に同じ額を賭けさせる</button><button class=ln onclick="closeSheet();act('close')">ベットせず締め切る</button>`:''}<small>足りないときは「コイン」から借りて、準備フェーズで備えます</small>`)}
function resSheet(){const ids=Object.keys(S.bt);
 if(S.md==='game')return sheet(`<h3>配分(ポット ${pot()})</h3>${Object.keys(S.p).map(k=>`<div class=r2><span>${esc(S.p[k].n)}</span><input class=al data-k=${k} type=number inputmode=numeric placeholder=0 oninput=sum()><button class="ln w" onclick="all1('${k}')">総取り</button></div>`).join('')}<div id=sm></div><button class=ok onclick="resG()">配分を確定</button>`)||sum();
 sheet(`<h3>結果(倍率)</h3>${ids.map(k=>`<div class=r2><span>${esc(S.p[k].n)} ${S.bt[k]}</span><select data-k=${k} class=rs><option value=l>ハズレ</option><option value=w>当たり</option><option value=d>引分</option></select><input class="w rm" data-k=${k} type=number step=any value=2></div>`).join('')}<small>当たり = ベット×倍率をハウスから払います(足りなければ払える分まで)</small><button class=ok onclick="resH()">結果を確定</button>`)}
function sum(){const t=[...document.querySelectorAll('.al')].reduce((a,i)=>a+(+i.value||0),0);$('#sm').textContent='合計 '+t+' / '+pot()}
function all1(k){document.querySelectorAll('.al').forEach(i=>i.value=i.dataset.k===k?pot():'');sum()}
function resG(){const al={};document.querySelectorAll('.al').forEach(i=>al[i.dataset.k]=Math.round(+i.value||0));closeSheet();act('resG',{al:al})}
function resH(){const rs={};document.querySelectorAll('.rs').forEach(i=>rs[i.dataset.k]={r:i.value,m:+document.querySelector('.rm[data-k="'+i.dataset.k+'"]').value});closeSheet();act('resH',{rs:rs})}
function menu(){sheet(`<h3>メニュー</h3><button onclick="reqs()">申請${mine().length?'('+mine().length+'件)':''}</button><button onclick="hist()">履歴</button><button onclick="share()">ルームを共有</button>${isH()&&Object.keys(S.p).length>1?`<button onclick="giveSheet()">代表者を移す</button>`:''}${S.ph==='prep'||S.ph==='lobby'?`<button class=ln onclick="if(confirm('退出しますか?'))leave()">退出</button>`:''}${isH()&&S.ph==='prep'?`<button class=dg onclick="if(confirm('最終精算します。借金を引いた最終コイン数で順位を発表します。よろしいですか?')){closeSheet();act('settle')}">最終精算</button>`:''}`)}
async function leave(){closeSheet();const r=await act('leave');if(r&&!r.err)reset()}
function giveSheet(){sheet(`<h3>代表者を移す</h3>${Object.keys(S.p).filter(k=>k!==me).map(k=>`<button onclick="giveTo('${k}')">${esc(S.p[k].n)}</button>`).join('')}`)}
function giveTo(k){if(confirm(S.p[k].n+' さんに代表者を移しますか?')){closeSheet();act('giveHost',{to:k})}}
function reqs(){const T={send:'送金',lend:'貸し',repay:'返済'};sheet(`<h3>申請</h3>${S.rq.length?S.rq.map(r=>{const o=r.by!==me&&(r.f===me||r.t===me);return`<div class=it>${T[r.k]}: ${esc(S.p[r.f].n)} → ${esc(S.p[r.t].n)} <b>${r.a}</b>${o?`<div class=r2><button class=ok onclick="rq('approve','${r.id}')">承認</button><button class=ln onclick="rq('reject','${r.id}')">断る</button></div>`:r.by===me?`<button class=ln onclick="rq('reject','${r.id}')">取り消す</button>`:''}</div>`}).join(''):'<p>申請はありません</p>'}`)}
function rq(a,id){closeSheet();act(a,{id:id})}
function hist(){sheet(`<h3>履歴</h3>${S.lg.map(l=>`<div class=it>${esc(l)}</div>`).join('')}`)}
async function share(){const u=location.origin+location.pathname+'?room='+S.id;
 try{if(navigator.share)return await navigator.share({title:'コインプラット',text:'ルームコード '+S.id,url:u});await navigator.clipboard.writeText(u);toast('URLをコピーしました')}catch(e){if(e&&e.name==='AbortError')return;sheet(`<h3>ルームコード ${S.id}</h3><input readonly value="${esc(u)}" onclick="this.select()">`)}}
function copyRes(){const t=(S.res||[]).map((r,i)=>(i+1)+'位 '+r.n+' '+r.f).join(' / ');try{navigator.clipboard.writeText(t).then(()=>toast('結果をコピーしました'),()=>toast('コピーできませんでした'))}catch(e){toast('コピーできませんでした')}}
function ended(){closeSheet();const rk=S.res||[];
 $('#app').innerHTML=`<div class=home><h1>最終結果</h1><p>借金を引いた最終コイン数です</p>${rk.map((r,i)=>`<div class="row ${r.id===me?'me':''}"><div class=n>${i+1}位 ${esc(r.n)}<small>残高 ${r.c} / 銀行借入 -${r.b}</small></div><b>${r.f}</b></div>`).join('')}<br><button onclick="copyRes()">結果をコピー</button><button class=b2 onclick="reset()">ホームに戻る</button></div>`;
 if(!acked){acked=true;post({a:'ack',r:rid,p:me});rid=null;sv(null)}}
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input[type=number]'))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});
let polling=false;
setInterval(async()=>{if(!rid||busy||!S||polling)return;polling=true;const my=rid;try{const r=await(await fetch(API+'?r='+my+'&v='+S.v)).json();
 if(!rid||rid!==my||!S||S.ph==='ended')return;
 if(r.err==='gone'){toast('ルームが終了しました');reset()}else if(r.s&&r.s.v>S.v){if(!r.s.p[me])return reset();S=r.s;if(!$('#sh').hidden&&S.ph!==(window._ph||S.ph))closeSheet();window._ph=S.ph;render()}}catch(e){}finally{polling=false}},1500);
(async()=>{const o=ld();if(o.rid&&o.me){const r=await(await fetch(API+'?r='+o.rid+'&v=0')).json().catch(()=>({}));
 if(r.s&&r.s.p[o.me]){S=r.s;me=o.me;rid=o.rid;window._ph=S.ph;return render()}sv(null)}home()})();
</script></body></html>
