<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.big.wait{background:transparent;border:2px dashed #9dbfe6;color:var(--mute);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:none}
.sm{width:88px;height:64px;border-radius:14px;border:2px solid var(--line);background:#eaf4ff;color:var(--ink);padding:0 4px;line-height:1.25;box-shadow:0 3px 0 var(--line)}
.sm b{display:block;font-size:15px}.sm i{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:normal;font-size:10px;color:var(--mute);margin-top:2px;line-height:1.2}
.sm.off{opacity:.5}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold2)}.big.wait:active{transform:none}.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#sh{position:fixed;inset:0;z-index:5}#sh[hidden]{display:none}
.bd{position:absolute;inset:0;background:rgba(15,44,82,.45)}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:#f6fbff;color:var(--ink);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85%;overflow:auto}
.pn h3{margin:0 0 12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pn button,.pn input,.pn select{width:100%;min-height:48px;margin-bottom:8px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:0 12px;color:var(--ink)}
.pn button{background:var(--top);color:#fff;border:0;box-shadow:0 3px 0 var(--top2)}.pn .ok{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--gold2);font-weight:700}.pn .dg{background:#d9412f;box-shadow:0 3px 0 #a52c1e}.pn .ln{background:#e6f2ff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.pn .it{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mk{font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;background:var(--gold);color:var(--ink);white-space:nowrap}.mk.dn{background:#d5e6fb;color:var(--mute)}.mk.x{background:#e4e4e4;color:#777}
.sec{font-size:13px;font-weight:700;color:var(--acc);margin:4px 0 6px}
.pd{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:6px;background:#fff8dc;border:2px solid var(--gold);border-radius:12px}.pd .n{flex:1}.pd small{display:block;color:var(--mute);font-size:12px}.pd b{font-size:18px}
.seg,.seg3,.seg2{display:grid;gap:6px;margin-bottom:8px}.seg{grid-template-columns:repeat(4,1fr)}.seg3{grid-template-columns:repeat(3,1fr)}.seg2{grid-template-columns:1fr 1fr}
.seg button,.seg3 button,.seg2 button{margin:0!important}
.rem{font-size:24px;font-weight:700;text-align:center;margin:4px 0 8px}
.hr{padding:8px 0;border-bottom:1px solid var(--line)}.hr>div:first-child{margin-bottom:6px;font-weight:700}.hr .rm{margin:8px 0 0}
.dt{margin-bottom:8px}.dt summary{padding:10px 4px;font-size:14px;color:var(--acc);font-weight:700}
.pn button:disabled{opacity:.4}
.pn .gh{font-size:13px;font-weight:700;color:var(--acc);margin:12px 0 4px}
.pn .it.xx{opacity:.55;text-decoration:line-through}.pn .it .zz{font-size:11px;color:var(--mute);margin-left:4px}.pn .it small{color:var(--mute);margin-left:4px}.pn .dl{font-size:12px;margin-top:2px}.pn .pl{color:#1a9d57}.pn .mn{color:#d9412f}

.pn label{font-size:13px;display:block;margin:6px 0 2px}
.hint{text-align:center;font-size:12px;color:var(--mute);margin-top:4px}
.r2{display:flex;gap:6px;align-items:center}.r2>*{flex:1}.r2 .w{flex:0 0 74px}
#app{flex:1;display:flex;flex-direction:column;min-height:0}#ver{text-align:center;font-size:11px;color:var(--mute);background:var(--card);padding:4px 0 calc(6px + env(safe-area-inset-bottom))}.home{padding:28px 20px;flex:1;overflow:auto}.lb{display:block;margin:0 0 6px;color:var(--mute);font-size:13px}#ld{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;background:var(--card);border:1px solid var(--acc);border-radius:20px;padding:8px 16px;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 6px rgba(15,44,82,.2)}#ld[hidden]{display:none}#ld i{width:14px;height:14px;border:2px solid var(--acc);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.busy button{opacity:.6;pointer-events:none}.guide{padding:20px;overflow:auto;flex:1}.guide h1{font-size:24px;margin:0 0 12px}.guide section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.guide h2{margin:0 0 8px;font-size:16px;color:var(--acc)}.guide p,.guide li{font-size:14px;line-height:1.7;margin:0 0 6px}.guide ul{margin:0;padding-left:20px}.guide .rec{border:1px dashed var(--acc);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;line-height:1.6}.guide>button{width:100%;height:48px;border-radius:12px;border:2px solid var(--acc);background:var(--card);color:var(--acc);font-weight:700;margin-bottom:12px}.home h1{margin:0 0 4px;font-size:28px}.home p{color:var(--mute);margin:0 0 22px}
.home input{width:100%;height:52px;border-radius:12px;border:2px solid var(--line);padding:0 14px;margin-bottom:10px;background:#fff;color:var(--ink)}
.home button{width:100%;height:52px;border-radius:12px;border:0;margin-bottom:10px;background:var(--top);color:#fff;font-weight:700;box-shadow:0 3px 0 var(--top2)}
.home .b2{background:var(--card);color:var(--acc);border:2px solid var(--acc);box-shadow:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:9;max-width:90%}#toast[hidden]{display:none}

.rw{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding:10px;background:#fff;border:2px solid var(--acc);border-radius:16px}
.wp{position:relative;width:150px;flex:0 0 150px}.wh svg{display:block;width:100%;height:auto}.wh{width:100%;border-radius:50%;box-shadow:0 0 0 5px var(--gold),0 3px 10px rgba(15,44,82,.3)}
.ptr{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:18px solid var(--ink);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.lgd{flex:1;min-width:0}.lr{display:flex;align-items:center;gap:6px;font-size:14px;padding:2px 0}.lr i{width:12px;height:12px;border-radius:50%;flex:0 0 12px}.lr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lr b{font-size:16px}.lr small{color:var(--mute);font-size:11px;min-width:36px;text-align:right}.lt{margin-top:6px;font-size:13px;color:var(--mute)}
.pv{display:flex;gap:12px;align-items:center;margin-bottom:10px}.pv .wp{width:120px;flex:0 0 120px}.pvt{flex:1;font-size:14px;line-height:1.5}.pvt b{font-size:24px;color:var(--acc)}
#spin{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#3a1c71 0,#0b1f3a 58%,#03070f 100%);color:#fff;overflow:hidden;animation:spi .25s ease-out;transition:opacity .4s}
#spin.out{opacity:0}
@keyframes spi{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:scale(1)}}
.sp-rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,214,102,.10) 0 5deg,transparent 5deg 12deg);animation:rot 7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.sp-stage{position:relative;width:min(86vw,400px);aspect-ratio:1;z-index:2;transition:transform .1s linear}
.sp-wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 0 50px rgba(255,200,61,.65),0 0 0 8px var(--gold),0 0 0 13px #b87800;will-change:transform}.sp-wheel svg{width:100%;height:100%;display:block}
.sp-ptr{position:absolute;top:-30px;left:50%;margin-left:-16px;z-index:3;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:38px solid #fff;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));transform-origin:50% 0}
.sp-ptr.tk{animation:tk .14s ease-out}@keyframes tk{0%{transform:rotate(-24deg)}100%{transform:rotate(0)}}
.sp-stage.shk{animation:shk .55s}@keyframes shk{0%,100%{translate:0 0}15%{translate:-9px 5px}30%{translate:8px -6px}45%{translate:-6px -4px}60%{translate:6px 5px}80%{translate:-3px 2px}}
.sp-ttl{position:relative;z-index:2;margin-top:28px;font-size:26px;font-weight:900;letter-spacing:.2em;color:var(--gold);text-shadow:0 0 14px rgba(255,200,61,.8)}
.sp-res{position:relative;z-index:2;text-align:center;margin-top:18px;min-height:96px}.sp-nm{font-size:40px;font-weight:900;text-shadow:0 0 18px currentColor,0 3px 0 rgba(0,0,0,.5);animation:pop2 .5s cubic-bezier(.2,1.6,.4,1)}.sp-w{font-size:26px;font-weight:900}.sp-amt{margin-top:4px;font-size:20px;color:var(--gold);font-weight:700}
@keyframes pop2{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.sp-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}.sp-flash.go{animation:fls .6s ease-out}@keyframes fls{0%{opacity:.85}100%{opacity:0}}
.sp-c{position:absolute;top:-30px;width:22px;height:22px;z-index:4;pointer-events:none;background:radial-gradient(circle at 32% 30%,#fff6bf 0,#ffd54a 45%,#e0a000 100%);border:2px solid #b87800;border-radius:50%;animation:cf 1.9s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#spin{display:none}}
@media (prefers-reduced-motion:no-preference){.pn{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.mnum.up,.mnum.dn,.row.fl,.pop{animation:none}.big:active,.sm:active{transform:none}.cn{display:none}}
</style></head><body>
<div id="app"></div><div id="ver">Ver 1.24</div><div id="ld" hidden><i></i>通信中…</div><div id="sh" hidden></div><div id="toast" hidden></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwDoBowKR2yK_MLBjjTrm9XKmmj_hmjY0X65CBUWa7_2gLg5lvoSoyhffpedNyKQXDnoQ/exec',MIN=100,BANK=10000;
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,me=null,rid=null,busy=false,acked=false,pc=null,lockUntil=0,PS=null,twT=0,FK='send',LF='open',RP=0,lastSp=0,SPINON=false,SPQ=null,WP={},wTw=0;
const PH={lobby:'待機',prep:'準備',bet:'賭け',result:'結果',ended:'終了'};
const TT={lobby:'参加受付中',prep:'準備の時間',bet:'賭けの時間',result:'結果の時間'};
const ld=()=>{try{return JSON.parse(localStorage.getItem('cm'))||{}}catch(e){return{}}};
const sv=o=>{try{o?localStorage.setItem('cm',JSON.stringify(o)):localStorage.removeItem('cm')}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
async function post(o){try{return await(await fetch(API,{method:'POST',body:JSON.stringify(o)})).json()}catch(e){return{err:'通信に失敗しました'}}}
async function act(a,o={}){if(busy||Date.now()<lockUntil)return;busy=true;spin(true);const r=await post(Object.assign({a:a,r:rid,p:me},o));busy=false;lockUntil=Date.now()+200;spin(false);
  if(r.err==='gone'){if(a!=='leave')toast('ルームが見つかりません');return reset()}
  if(r.err)toast(r.err);if(r.s){S=r.s;if(!S.p[me])return r;render()}return r}
let ldT=null;function spin(on){clearTimeout(ldT);document.body.classList.toggle('busy',on);if(on)ldT=setTimeout(()=>$('#ld').hidden=false,250);else $('#ld').hidden=true}
function reset(){S=null;me=rid=null;pc=null;PS=null;acked=false;sv(null);closeSheet();home()}
async function enter(a,name,code){if(busy||Date.now()<lockUntil)return;busy=true;code=String(code||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).trim();spin(true);const r=await post({a:a,n:name,r:code});busy=false;lockUntil=Date.now()+200;spin(false);if(r.err)return toast(r.err);try{localStorage.setItem('cmn',name)}catch(e){}S=r.s;me=r.p;rid=r.r;sv({rid:rid,me:me});render()}
let NAME='';const savedName=()=>{try{return localStorage.getItem('cmn')||''}catch(e){return''}};
function home(){NAME=NAME||savedName();
 $('#app').innerHTML=`<div class=home><h1>コインプラット</h1><p>ポーカーなどのコインを、みんなのスマホで管理します。</p>
 <label class=lb>プレイヤー名</label><input id=nm maxlength=12 placeholder="名前を入力" value="${esc(NAME)}">
 <button onclick="nameOk()">決定</button><div style="height:40px"></div><button class=b2 onclick="guide(home)">使い方</button></div>`}
function nameOk(){const n=$('#nm').value.trim();if(!n)return toast('名前を入力してください');NAME=n;try{localStorage.setItem('cmn',n)}catch(e){}choose()}
function choose(){const q=new URLSearchParams(location.search).get('room')||'';
 $('#app').innerHTML=`<div class=home><h1>${esc(NAME)} さん</h1><p>ルームを作るか、コードで参加します。</p>
 <button onclick="enter('create',NAME)">ルームを作る</button><div style="height:24px"></div>
 <label class=lb>ルームコード(4桁)</label><input id=cd inputmode=numeric maxlength=4 placeholder="1234" value="${esc(q)}"><button class=b2 onclick="enter('join',NAME,$('#cd').value)">ルームに参加</button>
 <div style="height:24px"></div><button class=b2 onclick="home()">← 名前を変える</button></div>`}
let GB=null;
function guide(b){GB=b;$('#app').innerHTML=`<div class=guide><button onclick="GB()">← 戻る</button><h1>使い方</h1>
<section><h2>このサイトでできること</h2><p>ポーカーなどで使うコインを、みんなのスマホで管理します。実物のコインを持ち運ぶ必要はありません。全員の残高・ポット・借金が、同じ画面でリアルタイムに共有されます。</p><ul><li>最大8人まで。全員が同じコインでスタート(初期値は10,000。代表者が、ゲーム開始前に「初期コイン」ボタンで変更できます)</li><li>ログイン不要。同じ端末で開き直すと、自動でルームに戻ります</li></ul></section>
<section><h2>全体の流れ</h2><ul><li>① ホームで名前を入れて「決定」</li><li>② 「ルームを作る」か、コードで「ルームに参加」</li><li>③ 全員が揃ったら、代表者が「ゲーム開始」</li><li>④ 準備 → 賭け → 結果 を、何度でも繰り返す</li><li>⑤ 代表者が最終精算 → 借金を引いた順位を発表</li></ul><p>ルームへの招待は、☰メニューの「ルームを共有」でURLを送るだけです。開始後の途中参加もできます。</p></section>
<section><h2>3つのフェーズ</h2><ul><li><b>準備</b>: 送金・貸し借り・銀行借入・親の交代など、コインのやり取りをする時間。ここでしかできません</li><li><b>賭け</b>: 全員がベットする時間。最低100コインから、金額は自由。残高が足りない人は、準備のうちに借りておきます</li><li><b>結果</b>: ポットの配分や、当たり外れを入力して、コインを動かす時間。終わると準備に戻ります</li></ul><p>賭けの途中は送金や借入ができないので、残高が食い違いません。</p></section>
<section><h2>ポットとは</h2><p>賭けられたコインを一時的に集めておく場所です。2種類あります。</p><p><b>① ゲームポット</b>(プレイヤー同士の勝負)<br>全員のベットが1つのポットに集まり、結果フェーズで、実際のコイン数を指定して配ります。「総取り」ボタンで、1人に全額を渡せます。2位以下にも配るときは、人ごとに数字を入れます。合計がポットと一致しないと確定できません。</p><p><b>② ハウスポット</b>(親との勝負 = 倍率)<br>親の持ち金です。詳しくは次の「親」を見てください。</p></section>
<section><h2>親とは</h2><p>「親」は、倍率ゲームの胴元です。同時に1人だけで、準備フェーズに「コイン → 親になる」で、ハウスポットへコインを入れて始めます。</p><ul><li>ハズレのベットは、ハウスポットに入ります</li><li>当たりの人には「ベット × 倍率」が、ハウスポットから払われます(2倍なら、賭けた額の2倍)</li><li>引き分けは、ベットがそのまま返ります</li><li>ハウスポットが足りないときは、払える分までです</li><li>親は、自分の賭けには参加できません</li><li>「親を降りる」と、ハウスポットの残りが全額、その人に戻ります。親の交代はこの方法で行います</li></ul><p>結果の入力は、親か代表者が行います。</p></section>
<section><h2>どっちを使う?(おすすめ)</h2><div class=rec><b>ゲームポット がおすすめ</b><br>ポーカー、大富豪、ババ抜きなど、プレイヤー同士で勝ち負けを決めるゲーム</div><div class=rec><b>倍率(親あり) がおすすめ</b><br>ルーレット、サイコロの目当て、ブラックジャック(親がディーラー)、「当たったら2倍」の自作ゲーム</div><p>どちらでも、賭けを始めるときに選べます。</p></section>
<section><h2>貸し借りと銀行</h2><ul><li><b>送金・貸す・借りる・返す</b>は、申請を出して、相手が承認すると成立します。間違いを防ぐためです。申請は、届くと画面に知らせが出ます。タップすると、ログの「未」から承認できます</li><li><b>銀行</b>は、初期コインと同じ額(初期値は10,000)ずつ、いつでも借りられます。上限も利息もありません。ただし、最終精算でその分が引かれます</li><li>プレイヤー同士の借金は、最終精算で、貸した人に加算、借りた人から減算されます</li></ul></section>
<section><h2>代表者の役目</h2><p>ルームを作った人が代表者です。ゲーム開始、賭けの開始と締め切り、ポットの配分、最終精算を担当します。「全員に同じ額を賭けさせる」も使えるので、みんながスマホを触らなくても進められます。代表者は、☰メニューの「代表者を移す」で、ほかの人に交代できます。</p></section>
<section><h2>画面の見方</h2><ul><li><b>上のバー</b>: 今のフェーズ(準備・賭け・結果)と、ルームコード。☰はメニューです</li><li><b>あなたのコイン</b>: 自分の残高です。増えると緑、減ると赤に光り、コインが動いて増減を伝えます</li><li><b>メッセージ</b>: 今なにをする場面か、誰を待っているかを表示します</li><li><b>大きいボタン</b>: 今のフェーズで次にやること。下の小さな文字が、押すと何が起こるかの説明です。押せないときは点線の枠になり、待っている理由が出ます</li><li><b>左「コイン」</b>: 準備フェーズのやり取り(送金・貸し借り・銀行・親)</li><li><b>右「戻す」</b>: 直前の1操作を取り消します。賭けの最中は、「取り消す」(自分のベット)、代表者は「全員に返す」になります</li><li><b>☰</b>: ログ、共有、退出、代表者の移譲、最終精算</li></ul></section>
<section><h2>ターンとログ</h2><p>賭け→結果の1サイクルを「1ターン」と数えます。準備中の送金・貸し借り・銀行などは、ターンの間として「ターン1.5」のように、見るだけの記録が残ります。ログは、☰メニューの「ログ」で見られます。</p><ul><li><b>未</b>: まだ変わるもの。ベット中、保留した賭け、承認待ちの申請</li><li><b>済</b>: 確定したもの。あとから変えられません。間違えたときは、「戻す」(直前の1回だけ)か、差額を動かす新しい操作で直します</li><li><b>取消</b>: 「戻す」で取り消された操作</li></ul><p>「未」の行からは、そのまま承認や、保留の処理ができます。</p></section>
<section><h2>保留</h2><p>結果が出るのが別のタイミングのときは、結果入力の画面で「あとで入力する(保留)」を選びます。コインはポットに入ったまま準備フェーズに戻り、画面に「保留中」のカードが出ます。保留中でも、別の賭けを始められます。結果が出たら、カードをタップして入力します(準備フェーズにできます)。</p><ul><li>保留中の賭けがある人は、退出できません</li><li>倍率ゲームの保留があるあいだは、親を降りられません</li><li>保留が残っていても、最終精算で全部返金して精算できます</li></ul></section>
<section><h2>ミニゲーム(ルーレット)</h2><p>代表者が、☰メニューの「ミニゲーム」→「ルーレット」で始めます。1回で1ターンです。</p><ul><li>賭けた人ごとに円盤の枠ができ、<b>賭け額が多いほど枠が広く</b>なります(全体が100%)。数字を変えるたびに、円盤も変わります</li><li>代表者が「回す」を押すと、円盤が回って、止まった枠の人が<b>ポット全部をもらいます</b>。回す前なら、賭け額の<b>上乗せ</b>も、取り消しもできます</li><li>回したあとは、<b>取り消せません</b>(「戻す」も使えません)</li><li>賭けた人が1人だけのときは、回さずに返金します</li></ul></section>
<section><h2>最終精算</h2><p>準備フェーズに、代表者が☰メニューから行います。</p><p>最終コイン数 = 残高 − 銀行の借入 − 借りた分 + 貸した分</p><p>この数字で順位が決まります。精算と同時に、ルームのデータは保存先(スプレッドシート)から全て削除されます。結果画面は、数分間だけ表示できます。必要なら、「結果をコピー」で保存してください。</p></section>
